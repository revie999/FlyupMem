<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FlyupMem Dashboard</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--surface:#161b22;--border:#30363d;--text:#c9d1d9;--text-dim:#8b949e;--accent:#58a6ff;--green:#3fb950;--yellow:#d29922;--red:#f85149;--purple:#bc8cff}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
a{color:var(--accent);text-decoration:none}
.container{max-width:1200px;margin:0 auto;padding:20px}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;background:var(--surface);border-bottom:1px solid var(--border);margin-bottom:20px}
header h1{font-size:20px;display:flex;align-items:center;gap:8px}
header h1 span{color:var(--accent)}
nav{display:flex;gap:8px}
nav button{padding:6px 14px;background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:6px;cursor:pointer;font-size:13px}
nav button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
nav button:hover{border-color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:16px;text-align:center}
.stat .num{font-size:28px;font-weight:700;color:var(--accent)}
.stat .label{font-size:12px;color:var(--text-dim);margin-top:4px}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:8px;margin-bottom:16px;overflow:hidden}
.panel-header{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.panel-header h2{font-size:15px;font-weight:600}
.panel-body{padding:16px}
.search-box{display:flex;gap:8px;margin-bottom:16px}
.search-box input{flex:1;padding:8px 12px;background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:6px;font-size:14px;outline:none}
.search-box input:focus{border-color:var(--accent)}
.search-box button{padding:8px 16px;background:var(--accent);color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:14px}
.filters{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.filters select{padding:6px 10px;background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:6px;font-size:13px}
.memory-list{list-style:none}
.memory-item{padding:12px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s}
.memory-item:hover{background:rgba(88,166,255,.08)}
.memory-item:last-child{border-bottom:none}
.memory-item .title{font-weight:600;font-size:14px;margin-bottom:4px}
.memory-item .meta{font-size:12px;color:var(--text-dim);display:flex;gap:12px;flex-wrap:wrap}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
.badge-active{background:rgba(63,185,80,.15);color:var(--green)}
.badge-candidate{background:rgba(210,153,34,.15);color:var(--yellow)}
.badge-fading{background:rgba(248,81,73,.15);color:var(--red)}
.badge-dormant{background:rgba(139,148,158,.15);color:var(--text-dim)}
.badge-retired{background:rgba(139,148,158,.1);color:var(--text-dim)}
.badge-raw{background:rgba(88,166,255,.15);color:var(--accent)}
.badge-observation{background:rgba(188,140,255,.15);color:var(--purple)}
.badge-mental_model{background:rgba(63,185,80,.15);color:var(--green)}
.badge-experience{background:rgba(210,153,34,.15);color:var(--yellow)}
.detail{display:none}
.detail.show{display:block}
.detail .back{margin-bottom:12px;cursor:pointer;color:var(--accent);font-size:13px}
.detail h3{font-size:16px;margin-bottom:8px}
.detail .field{margin-bottom:8px}
.detail .field .key{color:var(--text-dim);font-size:12px;display:block}
.detail .field .val{font-size:14px}
.graph-container{width:100%;height:400px;background:var(--bg);border-radius:8px;position:relative;overflow:hidden}
.graph-container canvas{width:100%;height:100%}
.config-table{width:100%;border-collapse:collapse}
.config-table th,.config-table td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--border);font-size:13px}
.config-table th{color:var(--text-dim);font-weight:500}
.config-table input{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:4px 8px;border-radius:4px;font-size:13px;width:200px}
.config-table button{padding:4px 10px;background:var(--accent);color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:12px}
.empty{text-align:center;padding:40px;color:var(--text-dim)}
#page-memories,#page-graph,#page-config{display:none}
#page-memories.show,#page-graph.show,#page-config.show{display:block}
</style>
</head>
<body>
<header>
  <h1>🔮 <span>FlyupMem</span> Dashboard</h1>
  <nav>
    <button class="active" onclick="showPage('memories')">Memories</button>
    <button onclick="showPage('graph')">Graph</button>
    <button onclick="showPage('config')">Config</button>
  </nav>
</header>
<div class="container">
  <!-- Stats -->
  <div class="stats" id="stats"></div>

  <!-- Memories Page -->
  <div id="page-memories" class="show">
    <div class="search-box">
      <input id="search-input" placeholder="Search memories..." onkeydown="if(event.key==='Enter')doSearch()">
      <button onclick="doSearch()">Search</button>
    </div>
    <div class="filters">
      <select id="filter-layer" onchange="loadMemories()">
        <option value="all">All Layers</option>
        <option value="raw">Engram (L3)</option>
        <option value="observation">Observation (L2)</option>
        <option value="mental_model">Mental Model (L1)</option>
        <option value="experience">Experience (L4)</option>
      </select>
      <select id="filter-status" onchange="loadMemories()">
        <option value="all">All Status</option>
        <option value="active">Active</option>
        <option value="candidate">Candidate</option>
        <option value="fading">Fading</option>
        <option value="dormant">Dormant</option>
        <option value="retired">Retired</option>
      </select>
    </div>
    <div class="panel">
      <div class="panel-body">
        <ul class="memory-list" id="memory-list"></ul>
      </div>
    </div>
    <div class="detail" id="detail"></div>
  </div>

  <!-- Graph Page -->
  <div id="page-graph">
    <div class="panel">
      <div class="panel-header"><h2>Entity Relationship Graph</h2></div>
      <div class="panel-body">
        <div class="graph-container"><canvas id="graph-canvas"></canvas></div>
      </div>
    </div>
  </div>

  <!-- Config Page -->
  <div id="page-config">
    <div class="panel">
      <div class="panel-header">
        <h2>Configuration</h2>
        <button onclick="resetConfig()" style="padding:6px 12px;background:var(--red);color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:12px">Reset to Defaults</button>
      </div>
      <div class="panel-body">
        <table class="config-table" id="config-table">
          <thead><tr><th>Key</th><th>Value</th><th>Type</th><th></th></tr></thead>
          <tbody id="config-body"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
const API = '';

// ─── Navigation ─────────────────────────────────────
function showPage(name) {
  document.querySelectorAll('[id^="page-"]').forEach(p => p.classList.remove('show'));
  document.getElementById('page-' + name).classList.add('show');
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  if (name === 'graph') loadGraph();
  if (name === 'config') loadConfig();
}

// ─── Stats ──────────────────────────────────────────
async function loadStats() {
  const res = await fetch(API + '/api/stats');
  const d = await res.json();
  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="num">${d.engrams}</div><div class="label">Engrams</div></div>
    <div class="stat"><div class="num">${d.observations}</div><div class="label">Observations</div></div>
    <div class="stat"><div class="num">${d.mentalModels}</div><div class="label">Mental Models</div></div>
    <div class="stat"><div class="num">${d.episodes}</div><div class="label">Episodes</div></div>
    <div class="stat"><div class="num">${d.graph.entities}</div><div class="label">Entities</div></div>
    <div class="stat"><div class="num">${d.graph.edges}</div><div class="label">Edges</div></div>
  `;
}

// ─── Memories ───────────────────────────────────────
async function loadMemories() {
  const layer = document.getElementById('filter-layer').value;
  const status = document.getElementById('filter-status').value;
  const res = await fetch(`${API}/api/memories?layer=${layer}&status=${status}&limit=50`);
  const d = await res.json();
  renderList(d.memories);
}

async function doSearch() {
  const q = document.getElementById('search-input').value.trim();
  if (!q) return loadMemories();
  const res = await fetch(`${API}/api/search?q=${encodeURIComponent(q)}`);
  const d = await res.json();
  renderList(d.results);
}

function renderList(memories) {
  const el = document.getElementById('memory-list');
  if (!memories.length) { el.innerHTML = '<div class="empty">No memories found</div>'; return; }
  el.innerHTML = memories.map(m => {
    const title = m.title || m.statement?.slice(0, 80) || m.id;
    const layerBadge = `<span class="badge badge-${m.layer}">${layerLabel(m.layer)}</span>`;
    const statusBadge = `<span class="badge badge-${m.status}">${m.status}</span>`;
    const date = (m.temporal?.learned_at ?? m.activation?.last_accessed ?? '').slice(0, 10);
    return `<li class="memory-item" onclick="showDetail('${m.id}')">
      <div class="title">${esc(title)}</div>
      <div class="meta">${layerBadge} ${statusBadge} <span>📅 ${date}</span> ${m.confidence ? `<span>🎯 ${m.confidence}/10</span>` : ''}</div>
    </li>`;
  }).join('');
}

async function showDetail(id) {
  const res = await fetch(`${API}/api/memory?id=${encodeURIComponent(id)}`);
  const d = await res.json();
  const m = d.memory;
  const el = document.getElementById('detail');
  const title = m.title || m.statement?.slice(0, 100) || m.id;

  let extra = '';
  if (m.source_observation_ids?.length) extra += `<div class="field"><span class="key">Source Observations</span><div class="val">${m.source_observation_ids.join(', ')}</div></div>`;
  if (m.evidence?.length) extra += `<div class="field"><span class="key">Evidence (${m.evidence.length})</span><div class="val">${m.evidence.map(e => e.quote || e.engram_id).join(' | ')}</div></div>`;
  if (m.associations?.length) extra += `<div class="field"><span class="key">Associations</span><div class="val">${m.associations.map(a => `${a.target} (${a.type}, ${a.weight})`).join(', ')}</div></div>`;
  if (d.related?.length) extra += `<div class="field"><span class="key">Graph Relations (${d.related.length})</span><div class="val">${d.related.map(r => `${r.target} [${r.type}]`).join(', ')}</div></div>`;

  el.innerHTML = `
    <div class="back" onclick="this.parentElement.classList.remove('show')">← Back to list</div>
    <div class="panel"><div class="panel-body">
      <h3>${esc(title)}</h3>
      <div class="field"><span class="key">ID</span><div class="val">${m.id}</div></div>
      <div class="field"><span class="key">Layer / Status</span><div class="val"><span class="badge badge-${m.layer}">${layerLabel(m.layer)}</span> <span class="badge badge-${m.status}">${m.status}</span></div></div>
      ${m.statement ? `<div class="field"><span class="key">Statement</span><div class="val">${esc(m.statement)}</div></div>` : ''}
      ${m.rationale ? `<div class="field"><span class="key">Rationale</span><div class="val">${esc(m.rationale)}</div></div>` : ''}
      <div class="field"><span class="key">Confidence</span><div class="val">${m.confidence ?? '—'}/10 ${d.currentActivation !== null ? `(activation: ${d.currentActivation.toFixed(3)})` : ''}</div></div>
      <div class="field"><span class="key">Scope / Domain</span><div class="val">${m.scope ?? '—'} / ${m.domain ?? '—'}</div></div>
      ${m.tags?.length ? `<div class="field"><span class="key">Tags</span><div class="val">${m.tags.join(', ')}</div></div>` : ''}
      <div class="field"><span class="key">Learned</span><div class="val">${m.temporal?.learned_at ?? '—'}</div></div>
      ${extra}
    </div></div>`;
  el.classList.add('show');
}

// ─── Graph ──────────────────────────────────────────
async function loadGraph() {
  const res = await fetch(API + '/api/graph');
  const d = await res.json();
  drawGraph(d.nodes, d.edges);
}

function drawGraph(nodes, edges) {
  const canvas = document.getElementById('graph-canvas');
  const ctx = canvas.getContext('2d');
  const rect = canvas.parentElement.getBoundingClientRect();
  canvas.width = rect.width * 2;
  canvas.height = rect.height * 2;
  ctx.scale(2, 2);
  const W = rect.width, H = rect.height;

  if (!nodes.length) {
    ctx.fillStyle = '#8b949e';
    ctx.font = '14px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('No graph data yet', W / 2, H / 2);
    return;
  }

  // Simple force-directed layout
  const pos = {};
  nodes.forEach((n, i) => {
    const angle = (2 * Math.PI * i) / nodes.length;
    const r = Math.min(W, H) * 0.35;
    pos[n.id] = { x: W / 2 + r * Math.cos(angle), y: H / 2 + r * Math.sin(angle), vx: 0, vy: 0 };
  });

  // Run simulation
  for (let iter = 0; iter < 200; iter++) {
    // Repulsion
    for (const a of nodes) for (const b of nodes) {
      if (a.id === b.id) continue;
      let dx = pos[a.id].x - pos[b.id].x;
      let dy = pos[a.id].y - pos[b.id].y;
      let dist = Math.sqrt(dx * dx + dy * dy) || 1;
      let force = 500 / (dist * dist);
      pos[a.id].vx += dx / dist * force;
      pos[a.id].vy += dy / dist * force;
    }
    // Attraction
    for (const e of edges) {
      if (!pos[e.from] || !pos[e.to]) continue;
      let dx = pos[e.to].x - pos[e.from].x;
      let dy = pos[e.to].y - pos[e.from].y;
      let dist = Math.sqrt(dx * dx + dy * dy) || 1;
      let force = (dist - 100) * 0.01;
      pos[e.from].vx += dx / dist * force;
      pos[e.from].vy += dy / dist * force;
      pos[e.to].vx -= dx / dist * force;
      pos[e.to].vy -= dy / dist * force;
    }
    // Center gravity
    for (const n of nodes) {
      pos[n.id].vx += (W / 2 - pos[n.id].x) * 0.01;
      pos[n.id].vy += (H / 2 - pos[n.id].y) * 0.01;
      pos[n.id].x += pos[n.id].vx * 0.3;
      pos[n.id].y += pos[n.id].vy * 0.3;
      pos[n.id].vx *= 0.8;
      pos[n.id].vy *= 0.8;
    }
  }

  // Draw edges
  ctx.strokeStyle = '#30363d';
  ctx.lineWidth = 1;
  for (const e of edges) {
    if (!pos[e.from] || !pos[e.to]) continue;
    ctx.beginPath();
    ctx.moveTo(pos[e.from].x, pos[e.from].y);
    ctx.lineTo(pos[e.to].x, pos[e.to].y);
    ctx.stroke();
  }

  // Draw nodes
  const colors = { tool: '#58a6ff', person: '#3fb950', project: '#bc8cff', concept: '#d29922' };
  for (const n of nodes) {
    const p = pos[n.id];
    const r = Math.min(8 + n.count * 2, 20);
    ctx.beginPath();
    ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
    ctx.fillStyle = colors[n.type] || '#58a6ff';
    ctx.fill();
    ctx.strokeStyle = '#0d1117';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = '#c9d1d9';
    ctx.font = '11px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(n.id, p.x, p.y + r + 14);
  }
}

// ─── Config ─────────────────────────────────────────
async function loadConfig() {
  const res = await fetch(API + '/api/config');
  const d = await res.json();
  const body = document.getElementById('config-body');
  body.innerHTML = d.keys.map(k => {
    const val = d.config[k.key] ?? '';
    return `<tr>
      <td><strong>${k.key}</strong><br><span style="color:var(--text-dim);font-size:11px">${k.description}</span></td>
      <td><input id="cfg-${k.key}" value="${esc(String(val))}"></td>
      <td>${k.type}${k.values ? ' [' + k.values.join('/') + ']' : ''}</td>
      <td><button onclick="saveConfig('${k.key}')">Save</button></td>
    </tr>`;
  }).join('');
}

async function saveConfig(key) {
  const val = document.getElementById('cfg-' + key).value;
  await fetch(API + '/api/config', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ key, value: val }),
  });
  loadConfig();
}

async function resetConfig() {
  if (!confirm('Reset all config to defaults?')) return;
  await fetch(API + '/api/config/reset', { method: 'POST' });
  loadConfig();
}

// ─── Helpers ────────────────────────────────────────
function layerLabel(l) {
  return { raw: 'Engram', observation: 'Obs', mental_model: 'MM', experience: 'Exp' }[l] || l;
}
function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

// ─── Init ───────────────────────────────────────────
loadStats();
loadMemories();
</script>
</body>
</html>
